services:
  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5273:5173"
    depends_on:
      - api-gateway

  api-gateway:
    build: ./services/api-gateway
    env_file:
      - ./services/api-gateway/.env
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
      - order-service
      - ai-service

  user-service:
    build: ./services/user-service
    env_file:
      - ./services/user-service/.env
    ports:
      - "3001:3001"
    volumes:
      - ./data/users.db:/app/db/users.db

  product-service:
    build: ./services/product-service
    env_file:
      - ./services/product-service/.env
    ports:
      - "3002:3002"
    volumes:
      - ./data/products.db:/app/db/products.db
      - ./data/product_uploads:/app/uploads/products

  order-service:
    build: ./services/order-service
    env_file:
      - ./services/order-service/.env
    ports:
      - "3003:3003"
    volumes:
      - ./data/orders.db:/app/db/orders.db

  ai-service:
    build: ./ai-service
    env_file:
      - ./ai-service/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j12345
    ports:
      - "8000:8000"
    volumes:
      - ./ai-service:/app
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5.23
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/neo4j12345
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
